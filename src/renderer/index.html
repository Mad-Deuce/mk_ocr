<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Electron</title>
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />

  <link href="./assets/main.css" type="text/css" rel="stylesheet" />
</head>

<body>


  <div class="wrapper" id="step-text-wrapper">
    <label for="">Шаблон</label>
    <select class="select" id="template-selector" name="template-selector">
      <option value="install">Установить изделие</option>
      <option value="stick">Наклеить изделие</option>
    </select>
    <br />
    <br />

    <span id="step">
      УСТАНОВИТЬ ДЕТАЛЬ ПОЗ. <button id="btn-copy-step" style="background-color: red;">3</button> ( <input type="number"
        value="4" style="width: 40px"> шт.), <button id="btn-copy-step" style="background-color: red;">7
      </button> ( <input type="number" value="4" style="width: 40px"> шт.)</span>
    <br />
    <span>
      НА ДЕТАЛЬ ПОЗ. <button id="btn-copy-step" style="background-color: red;">5</button> СОГЛ. ЧЕРТ,</span>
    <br />
    <span>
      КРЕПИТЬ ДЕТАЛЬЮ ПОЗ.<button id="btn-copy-step" style="background-color: red;">21</button> ( <input type="number"
        value="4" style="width: 40px"> шт.),</span>
    <br />
    <span>
      ПРОЛОЖИВ ШАЙБЫ ПОЗ.<button id="btn-copy-step" style="background-color: red;">44</button> ( <input type="number"
        value="4" style="width: 40px"> шт.),</span>
    <br />
    <span>
      СТОПОРИТЬ СОГЛ. п.<input type="number" value="4" style="width: 40px"> ТТ ЧЕРТ. И ТИ </span>
    <br />
    <br />
    <input type="checkbox" id="cbx">
    <label for="cbx">СТОПОРИТЬ</label>
    <br />
    <br />
    <textarea style="width: 100%" rows="5" height="5" class="input-text" id="step-text-input">
    УСТАНОВИТЬ ДЕТАЛИ ПОЗ. 3, 7 НА ДЕТАЛЬ ПОЗ. 5 СОГЛ. ЧЕРТ, КРЕПИТЬ ДЕТАЛЬЮ ПОЗ. 21, ПРОЛОЖИВ ШАЙБЫ ПОЗ. 44, СТОПОРИТЬ СОГЛ. п.3 ТТ ЧЕРТ. И ТИ
    </textarea>
    <br />
    <button id="btn-save-step">Save</button>
    <button id="btn-copy-step">Copy</button>
  </div>

  <div class="scan-region" id="scan-region" style="height: 50px; width: 50px;"></div>

  <div class="wrapper" id="recognize-info-wrapper">
    <div class="value" id="value">—</div>
    <div class="meta" id="meta">Arial Bold 24 · Template matching</div>
  </div>

  <form class="wrapper" id="menu-wrapper">
    <fieldset class="menu" id="menu">
      <legend>install/add as:</legend>
      <!-- <li class="menu-item"> -->
        <button class="button" id="btn-add-part">part</button>
      <!-- </li> -->
      <!-- <li class="menu-item"> -->
        <button class="button" id="btn-add-placet">place</button>
      <!-- </li> -->
      <!-- <li class="menu-item"> -->
        <button class="button" id="btn-add-fastener">fastener</button>
      <!-- </li> -->
      <!-- <li class="menu-item"> -->
        <button class="button" id="btn-add-washer">washer</button>
      <!-- </li> -->
    </span>
  </form>


  <script type="module" src="./src/renderer.ts"></script>
</body>

</html>
